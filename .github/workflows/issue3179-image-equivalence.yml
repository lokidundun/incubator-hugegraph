# Fork-only verification of the optional Maven module selection.
name: Issue 3179 image content equivalence
'on':
  push:
    branches: [codex/issue-3179-image-check]
permissions:
  contents: read
  packages: read
jobs:
  compare:
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    env:
      ARCH: ${{ matrix.arch }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Wait for both tested image sets
        run: |
          python3 - <<'PY'
          import json, os, time, urllib.request
          url = 'https://api.github.com/repos/lokidundun/incubator-hugegraph/actions/runs/33952290127/jobs'
          for attempt in range(90):
              req = urllib.request.Request(url, headers={'Authorization': 'Bearer '+os.environ['GH_TOKEN'],
                                                         'Accept': 'application/vnd.github+json'})
              with urllib.request.urlopen(req, timeout=30) as response:
                  jobs = json.load(response)['jobs']
              selected = [j for j in jobs if j['name'] in ('reference / validate','scoped-publication / validate')]
              if len(selected) == 2 and all(j['status'] == 'completed' for j in selected):
                  assert all(j['conclusion'] == 'success' for j in selected), 'Source publication failed'
                  break
              time.sleep(10)
          else:
              raise SystemExit('Timed out waiting for source publication')
          PY
      - name: Compare installed application files packages and image configuration
        run: |
          set -euo pipefail
          uname -a
          case "$ARCH:$(uname -m)" in amd64:x86_64|arm64:aarch64) ;; *) exit 1;; esac
          for variant in reference scoped; do
            mkdir -p "snapshots/$variant"
            for component in pd store server standalone; do
              image="ghcr.io/lokidundun/issue3179-$component:followup-33952290127-1-$variant"
              home="$component"
              if [ "$component" = standalone ]; then home=server; fi
              docker pull --platform "linux/$ARCH" "$image"
              test "$(docker image inspect --format '{{.Architecture}}' "$image")" = "$ARCH"
              container=$(docker create --platform "linux/$ARCH" --entrypoint /bin/true "$image")
              mkdir -p "snapshots/$variant/$component"
              docker cp "$container:/hugegraph-$home/." "snapshots/$variant/$component/"
              docker rm -v "$container"
              docker run --rm --platform "linux/$ARCH" --entrypoint /bin/sh "$image" \
                -c 'dpkg-query -W -f="\${Package} \${Version}\n" | sort' \
                > "snapshots/$variant/$component-packages.txt"
              docker image inspect --format '{{json .Config}}' "$image" \
                > "snapshots/$variant/$component-config.json"
              docker image rm "$image"
            done
            python3 .github/issue3179/inventory.py record "snapshots/$variant" "$variant-inventory.json"
          done
          python3 .github/issue3179/inventory.py compare reference-inventory.json scoped-inventory.json comparison.json
      - name: Upload comparison
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: image-comparison-${{ matrix.arch }}
          path: |
            *inventory.json
            comparison.json
          retention-days: 7
          if-no-files-found: error

